name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # .nvmrc is the single source of truth, so CI can't drift from what
          # contributors run locally.
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fourierhq/sdk build
      - run: pnpm typecheck
      - run: pnpm test
      # Environment isolation is a safety property, not a feature: if a query ever
      # loses its scope, preview data silently appears in production numbers and
      # nothing else would catch it. Proving that needs a real ClickHouse.
      #
      # Started here rather than as a `services:` container because a container that
      # fails its healthcheck reports only "unhealthy" and throws the server log away.
      # Polling /ping ourselves means a failure prints why.
      - name: Start ClickHouse
        run: |
          # The 26.x image refuses an empty password for `default`, unlike a local
          # Homebrew install — so CI has to set one and hand the same to the tests.
          docker run -d --name clickhouse -p 8123:8123 \
            -e CLICKHOUSE_USER=default \
            -e CLICKHOUSE_PASSWORD=fourier_ci \
            --ulimit nofile=262144:262144 \
            clickhouse/clickhouse-server:26.8
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8123/ping >/dev/null 2>&1; then
              echo "ClickHouse ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::ClickHouse never answered /ping"
          docker logs clickhouse
          exit 1

      - run: pnpm --filter @fourierhq/core test:integration
        env:
          CLICKHOUSE_URL: http://localhost:8123
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: fourier_ci

      - name: ClickHouse log on failure
        if: failure()
        run: docker logs clickhouse 2>&1 | tail -50
